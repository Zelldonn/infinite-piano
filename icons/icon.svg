  <rect width="512" height="512" rx="108" fill="url(#bgGlow)"/>
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#3b352f" stroke-width="6"/>
  <!-- 5 minimal staff lines -->
